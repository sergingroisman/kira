# Kira PR Review Workflow (TRUST-inspired)
#
# Status: v0.5 — schema-only. Executor lands when WorkflowLoader ships.
# For v0 the REPL `/review` command can read this file to know which
# dimensions + grounding to load and which agents to spawn.
#
# Lifecycle (planned):
#   1. Reviewer agents (6) spawned in parallel — one per dimension.
#   2. Each emits findings.json + coverage.json (schema = reviewer.md).
#   3. Cascade gate runs MetaReview (L6) per agent → drops hallucinated
#      findings + halts on partial coverage.
#   4. Consolidator agent merges surviving findings into REVIEW.md.

version: 1
id: pr-review
description: Multi-dimensional PR review with anti-hallucination meta-gate.

# Grounding loaded into every reviewer's system context.
grounding:
  required:
    - AGENTS.md
  optional:
    - AGENTS-memory/lessons/**

# Six parallel reviewer agents. Each = AgentKind::Reviewer with a `dimension`
# task parameter. Tier=heavy (overridable). Read-only ownership.
agents:
  - id: security
    kind: reviewer
    dimension: security
    tier: heavy
    rules_source: lessons + AGENTS.md#security
  - id: performance
    kind: reviewer
    dimension: performance
    tier: heavy
    rules_source: lessons + AGENTS.md#performance
  - id: architecture
    kind: reviewer
    dimension: architecture
    tier: heavy
    rules_source: lessons + AGENTS.md#architecture
  - id: regression
    kind: reviewer
    dimension: regression
    tier: heavy
    rules_source: lessons + diff-only heuristics
  - id: requirements
    kind: reviewer
    dimension: requirements
    tier: heavy
    rules_source: PR body + linked spec/ticket
  - id: tests
    kind: reviewer
    dimension: tests
    tier: heavy
    rules_source: lessons + AGENTS.md#testing

# Cascade gate config applied to EACH reviewer's output.
gates:
  cascade:
    skip_embedding: true   # reviewer findings, not natural prose
    skip_judge: true       # meta-review is the judge here
    skip_meta_review: false
  meta_review:
    coverage_min_pct: 100
    confidence_min: 0.80
    drop_failed_findings: true

# Consolidator step (post-gates). Merges surviving findings → REVIEW.md.
consolidator:
  kind: writer
  tier: standard
  owns:
    - REVIEW.md
  group_by: severity
  severity_order: [security, critical, performance, warning, suggestion]
  include_highlights: true
  include_files_with_no_findings: true

# Termination policy.
policy:
  any_agent_halt: halt_workflow
  all_pass: emit_review_md
  on_halt: preserve_artifacts_under .kira/runs/<run_id>/
