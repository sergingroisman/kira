[package]
name = "kira"
version = "0.1.0"
edition = "2024"
description = "KIRA — Knowledge-Informed Remediation Agent (Keep It Running, Always)"
license = "MIT"

[dependencies]
azure_devops_rust_api = { version = "0.39", features = ["wit", "core"] }
# Already a transitive dependency of azure_devops_rust_api (same version); now
# declared so src/ado can build `Url` values for the endpoint override used by
# the tests with a fake Azure DevOps server on 127.0.0.1.
azure_core = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Direct dependency: OS keyring storage for the PAT (src/credentials.rs).
# Platform features kept minimal (Windows native + Linux secret-service via
# pure-Rust zbus, no C dependency); elsewhere Entry::new fails at runtime and
# the code falls back to the AZURE_DEVOPS_PAT env var with a clear message.
keyring = { version = "4", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
# Direct dependency: local session/fact store (src/store/). The `bundled`
# feature compiles SQLite into the kira binary, so `kira history`, `kira note`
# and the automatic session trail work out of the box with zero extra
# installation — which matters on Windows, where there is no system sqlite3
# package to rely on. Version pinned exactly to the current stable 0.41 line
# (M1.1 of the v2 plan §3).
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Direct dependency: the Ollama backend (src/llm/ollama.rs) performs its own
# HTTP calls to localhost; before this it was only transitive via azure_core.
reqwest = { version = "0.13", features = ["json"] }
# Direct dependency: the privacy boundary (src/redact.rs) masks PATs, tokens,
# e-mails and CPFs before any log, error or LLM prompt (AGENTS.md). Already a
# transitive dependency of the Azure SDK at this exact version; declared so the
# masking layer is explicit and cannot silently change behaviour on an upstream
# bump. Masking is parser work, never an LLM task (ADR-0016).
regex = "1.13.1"

[profile.release]
strip = true
