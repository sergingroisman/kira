[package]
name = "kira"
version = "0.1.0"
edition = "2024"
description = "KIRA — Knowledge-Informed Remediation Agent (Keep It Running, Always)"
license = "MIT"

[dependencies]
azure_devops_rust_api = { version = "0.39", features = ["wit", "core"] }
# Already a transitive dependency of azure_devops_rust_api (same version); now
# declared so src/ado can build `Url` values for the endpoint override used by
# the tests with a fake Azure DevOps server on 127.0.0.1.
azure_core = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Direct dependency: OS keyring storage for the PAT (src/credentials.rs).
# Platform features kept minimal: Windows Credential Manager, macOS Keychain
# (apple-native) and Linux secret-service via pure-Rust zbus. Without the
# apple store the macOS build compiled but failed at runtime, silently falling
# back to the AZURE_DEVOPS_PAT env — the exact friction this PR removes.
keyring = { version = "4", default-features = false, features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
# Direct dependency: local session/fact store (src/store/). The `bundled`
# feature compiles SQLite into the kira binary, so `kira history`, `kira note`
# and the automatic session trail work out of the box with zero extra
# installation — which matters on Windows, where there is no system sqlite3
# package to rely on. Version pinned exactly to the current stable 0.41 line
# (M1.1 of the v2 plan §3).
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Direct dependency: the Ollama backend (src/llm/ollama.rs) performs its own
# HTTP calls to localhost; before this it was only transitive via azure_core.
reqwest = { version = "0.13", features = ["json"] }
# Direct dependency: the privacy boundary (src/redact.rs) masks PATs, tokens,
# e-mails and CPFs before any log, error or LLM prompt (AGENTS.md). Already a
# transitive dependency of the Azure SDK at this exact version; declared so the
# masking layer is explicit and cannot silently change behaviour on an upstream
# bump. Masking is parser work, never an LLM task (ADR-0016).
regex = "1.13.1"
# Direct dependency: deterministic repository walk for the context packer
# (src/context/repo.rs, ADR-0015). Already in Cargo.lock at this version as a
# transitive dependency of the Azure SDK, so the tree does not grow — declared
# so the grep layer cannot change behaviour silently on an upstream bump.
walkdir = "2"
# Direct dependency: the read-only TUI shell of `kira dashboard` (src/tui/,
# ADR-0014). Ratatui is the de-facto terminal UI in Rust: pure Rust over
# crossterm, no system libs — CI-safe on the 3 SOs. Feature `crossterm` is
# what the shell draws on; no statui dependency of any kind enters.
ratatui = { version = "0.29", features = ["crossterm"] }
# Direct dependency: event polling and raw-mode/screen control of the
# dashboard loop (src/tui/app.rs). Pinned to the same 0.28 line ratatui 0.29
# builds on — mixing crossterm versions would make event/backend types
# incompatible at compile time.
crossterm = "0.28"

[dev-dependencies]
# Direct read of the store DB inside the `kira context` e2e (ADR-0021 redaction
# proof: the index rows on disk must not carry secrets). Same exact version
# already compiled for the runtime store — no new dependency, no new build.
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[profile.release]
strip = true
