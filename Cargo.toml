[package]
name = "kira"
version = "0.1.0"
edition = "2024"
description = "KIRA — Knowledge-Informed Remediation Agent (Keep It Running, Always)"
license = "MIT"

[dependencies]
azure_devops_rust_api = { version = "0.39", features = ["wit", "core"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
