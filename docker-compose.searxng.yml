# SearXNG local dev — sovereign search engine for Kira web tools.
#
# Start:  docker compose -f docker-compose.searxng.yml up -d
# Test:   curl "http://127.0.0.1:8888/search?q=rust+async&format=json" | jq .
# Stop:   docker compose -f docker-compose.searxng.yml down
#
# Config lives in `infra/searxng/settings.yml` (created on first up).
services:
  searxng:
    image: searxng/searxng:latest
    container_name: kira-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    restart: unless-stopped
