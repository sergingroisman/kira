[package]
name = "kira-core"
version = "0.1.0"
edition = "2024"
description = "Kira harness — Rust core daemon (axum HTTP+SSE)"
license = "MIT"
publish = false

[[bin]]
name = "kira-cored"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Errors (v0 catch-all)
anyhow = "1"

# CLI args
clap = { version = "4", features = ["derive", "env"] }

# Config / env
dotenvy = "0.15"

# TOML parsing (hooks config)
toml = "0.8"

# YAML parsing (workflows .kira/workflows/*.yaml)
serde_yaml = "0.9"

# Stream adapters (BroadcastStream for SSE pillar fan-out)
tokio-stream = { version = "0.1", features = ["sync"] }

# Web tools (P0 + sovereign search via SearXNG)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
readability = "0.3"
htmd = "0.1"
url = "2.5"
hickory-resolver = "0.24"

# Embedded ACID DB for durable state (worktrees, agents, plans, etc).
redb = "2"

# IDs
uuid = { version = "1", features = ["v5", "v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# TypeScript bindings export (generates .d.ts for agent/src/generated/)
ts-rs = { version = "10", features = ["serde-json-impl"] }

# Glob matching (ownership patterns)
globset = "0.4"

# LLM clients (OpenAI-compatible — works with DashScope, DeepSeek, SiliconFlow, Ollama)
async-openai = "0.27"

# Streams (for SSE token streaming)
futures = "0.3"

# MCP client (Model Context Protocol — stdio transport to child processes)
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }

# SHA-256 hashing (MCP schema pinning — SC7)
sha2 = "0.10"

# Hex encoding (schema hash display)
hex = "0.4"

# Regex (bash tool arg validation, SC3)
regex = "1"

# Lazy statics (compile regex once)
once_cell = "1"

# Lightweight regex (PII scrubbing — no full regex pull-in)
regex-lite = "0.1"

# Atomic config hot-swap (live tokens.toml reload)
arc-swap = "1"

# Async trait sugar (LLM backend / memory store traits)
async-trait = "0.1"

# Embedded vector store: SQLite + sqlite-vec (cross-thread memory)
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"

# Code search (ripgrep engine + gitignore-aware walker)
grep = "0.3"
ignore = "0.4"

# AST parsing (read_symbol / project_map orientation)
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"

# Web tools: page metadata + robots.txt compliance
webpage = "2"
texting_robots = "0.2"

[dev-dependencies]
# Temp dirs/files for filesystem-touching tests
tempfile = "3"
# Property-based testing
proptest = "1"

[lints.rust]
# `deny` (not `forbid`) so the sqlite-vec FFI module can opt in via
# `#![allow(unsafe_code)]` — the single sanctioned unsafe boundary.
unsafe_code = "deny"
# Dead code is expected in v0 — functions are planned, not yet wired
dead_code = "allow"
# async_fn_in_trait: auto trait bounds not needed for mac-local v0
async_fn_in_trait = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Permissive for v0 — tighten later
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Doc-style: not enforcing doc coverage in v0
doc_markdown = "allow"
missing_panics_doc = "allow"
doc_lazy_continuation = "allow"
too_long_first_doc_paragraph = "allow"
# Cast policy: intentional in v0 numerical code
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Style: too subjective for v0
unreadable_literal = "allow"
similar_names = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
trivially_copy_pass_by_ref = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
assigning_clones = "allow"
return_self_not_must_use = "allow"
should_implement_trait = "allow"
# Nursery: too aggressive for v0
significant_drop_tightening = "allow"
literal_string_with_formatting_args = "allow"
format_push_string = "allow"
or_fun_call = "allow"
# Refactor targets — allow now, fix in v0.5
ptr_arg = "allow"
len_without_is_empty = "allow"
unused_async = "allow"
unnecessary_wraps = "allow"
while_let_loop = "allow"
manual_let_else = "allow"
manual_strip = "allow"
manual_clamp = "allow"
needless_continue = "allow"
useless_let_if_seq = "allow"
overly_complex_bool_expr = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
