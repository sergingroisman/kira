# Release verificável do KIRA.
#
# Publica, para cada tag `v*`:
#   kira-<target>.tar.gz  (Linux/macOS)  ·  kira-<target>.zip  (Windows)
#   install.sh · install.ps1
#   SHA256SUMS            (formato coreutils, cobre TUDO que foi publicado)
#
# O SHA256SUMS é gerado DEPOIS de juntar binários e scripts, de propósito: um só
# arquivo cobre o que o usuário executa e o que ele usa para conferir. Os
# instaladores conferem o hash antes de tocar no sistema e falham fechado.
#
# Limite honesto: o hash mora no mesmo host do binário — prova integridade de
# transporte (corrupção, download truncado, troca parcial), não autoria. Prova
# de autoria exige assinatura (minisign/cosign) ou hash fixado na documentação.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked

      # Empacotamento por plataforma: tar.gz no Unix, zip no Windows (o
      # install.ps1 usa Expand-Archive, que só entende zip).
      - name: empacotar (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="kira-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C target/release kira
          echo "$out" > artifact-name.txt

      - name: empacotar (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="kira-${{ matrix.target }}.zip"
          cd target/release && 7z a "../../$out" kira.exe >/dev/null
          cd ../.. && echo "$out" > artifact-name.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            kira-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true

      - name: juntar instaladores ao pacote publicado
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 dist/
          ls -l dist

      # coreutils: "<sha256>  <nome>". Gerado por último, para cobrir binários
      # e instaladores no MESMO arquivo.
      - name: gerar SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum kira-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS

      # Falha fechado se algum instalador não estiver listado — é barato
      # conferir aqui e caro descobrir no cliente.
      - name: conferir que o SHA256SUMS cobre tudo
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          for f in install.sh install.ps1 SHA256SUMS; do
            test -s "$f" || { echo "faltando: $f" >&2; exit 1; }
          done
          for f in kira-*; do
            grep -q "  $f\$" SHA256SUMS || { echo "não listado: $f" >&2; exit 1; }
          done

      - name: criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Binários com SHA256SUMS. Verificação obrigatória: \`sha256sum -c SHA256SUMS\` (Linux/macOS) ou \`Get-FileHash\` (Windows) antes de executar."
